[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gtsh-pseudonymizer"
version = "0.2.0"
description = "Reversible German PII pseudonymization with a fail-closed privacy gate"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "GTSH Engineering"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/GTSH-beyond-Gaming/gtsh-pseudonymizer"
Issues = "https://github.com/GTSH-beyond-Gaming/gtsh-pseudonymizer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gtsh_pseudonymizer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
